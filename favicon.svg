<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f183d"/>
      <stop offset="100%" stop-color="#0c0d14"/>
    </linearGradient>
    <linearGradient id="proton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#6d4aff"/>
      <stop offset="100%" stop-color="#4f2bff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6d4aff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)" stroke="#2e245a" stroke-width="6"/>
  <!-- Outer Glow Triangle / Shield -->
  <path d="M256 80 L420 380 C400 440, 112 440, 92 380 Z" fill="none" stroke="url(#proton)" stroke-width="16" opacity="0.4" filter="url(#glow)"/>
  <!-- Main Proton Shape -->
  <path d="M256 96 L404 370 C386 422, 126 422, 108 370 Z" fill="url(#proton)"/>
  <!-- Dynamic Inner Wave / Cut -->
  <path d="M256 160 L350 340 C336 380, 176 380, 162 340 Z" fill="#0c0d14" opacity="0.9"/>
  <circle cx="256" cy="270" r="38" fill="url(#accent)" filter="url(#glow)"/>
</svg>